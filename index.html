<!-- ═══════════════ BARRA INFERIOR (móvil) ═══════════════ -->
<nav class="tabbar" aria-label="Navegación rápida" data-tabbar></nav>

<!-- ═══════════════ PANEL DE MENÚ ═══════════════ -->
<div class="panel" id="panel" hidden>
  <div class="panel__scrim" data-menu-close></div>
  <div class="panel__card" role="dialog" aria-modal="true" aria-label="Menú de secciones">
    <div class="panel__top">
      <strong class="panel__title"></strong>
      <button class="iconbtn" type="button" data-menu-close><svg class="ic" aria-hidden="true"><use href="#ic-close"/></svg><span class="sr">Cerrar</span></button>
    </div>
    <ul class="panel__list" data-nav-panel></ul>
    <button class="btn btn--block btn--ghost" type="button" data-pdf>
      <svg class="ic" aria-hidden="true"><use href="#ic-download"/></svg><span>Descargar PDF</span>
    </button>
  </div>
</div>

<!-- ═══════════════ PLAYLIST (dock flotante) ═══════════════ -->
<div class="dock" data-dock hidden>
  <button class="dock__btn" type="button" data-dock-toggle aria-expanded="false">
    <svg class="ic" aria-hidden="true"><use href="#ic-music"/></svg>
    <span data-dock-title></span>
    <svg class="ic dock__chev" aria-hidden="true"><use href="#ic-chevron"/></svg>
  </button>
  <div class="dock__body" data-dock-body hidden></div>
</div>

<!-- ═══════════════ BIENVENIDA ═══════════════ -->
<div class="modal" data-welcome hidden>
  <div class="modal__scrim" data-welcome-close></div>
  <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="w-t" data-welcome-card></div>
</div>

<!-- ═══════════════ AVISOS ═══════════════ -->
<div class="toast" data-toast role="status" aria-live="polite" hidden></div>

<script src="./app.js"></script>
